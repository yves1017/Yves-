<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yves 嚴選特惠 - 旗艦版後台管理系統</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6.4 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --sidebar-bg: #0f172a;
      --card-border-radius: 14px;
      --main-bg: #f8fafc;
    }

    body {
      background-color: var(--main-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #334155;
      min-height: 100vh;
    }

    /* 密碼遮罩鎖層 */
    #auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 頂部導覽列 */
    .admin-navbar {
      background: var(--sidebar-bg);
      border-bottom: 1px solid #1e293b;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 統計指標卡片 */
    .metric-card {
      border: none;
      border-radius: var(--card-border-radius);
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      height: 100%;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    .metric-card.primary::before { background-color: #3b82f6; }
    .metric-card.success::before { background-color: #10b981; }
    .metric-card.warning::before { background-color: #f59e0b; }
    .metric-card.danger::before { background-color: #ef4444; }

    .metric-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    /* 文字完整顯示（移除裁切設定） */
    .full-text-display {
      word-break: break-word;
      white-space: normal;
      overflow: visible !important;
      text-overflow: clip !important;
      line-height: 1.4;
    }

    /* 主要卡片與區塊 */
    .panel-card {
      border: none;
      border-radius: var(--card-border-radius);
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      margin-bottom: 2rem;
    }

    .panel-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #f1f5f9;
      background-color: #ffffff;
      border-top-left-radius: var(--card-border-radius);
      border-top-right-radius: var(--card-border-radius);
    }

    /* 表格樣式優化 */
    .custom-table th {
      background-color: #f8fafc;
      color: #64748b;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      padding: 1rem 0.75rem;
      border-bottom: 2px solid #e2e8f0;
    }

    .custom-table td {
      padding: 1.1rem 0.75rem;
      vertical-align: middle;
      border-bottom: 1px solid #f1f5f9;
    }

    .product-thumbnail {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background-color: #f8fafc;
    }

    .badge-click-count {
      background-color: #eff6ff;
      color: #1d4ed8;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      border: 1px solid #dbeafe;
    }

    .nav-tabs .nav-link {
      color: #94a3b8;
      font-weight: 600;
      border: none;
      padding: 0.75rem 1.25rem;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }

    .nav-tabs .nav-link.active {
      color: #60a5fa !important;
      background: transparent;
      border-bottom-color: #3b82f6 !important;
    }

    footer {
      margin-top: auto;
      padding: 1.5rem 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body class="d-flex flex-column">

  <!-- 1. 後台密碼驗證遮罩鎖 -->
  <div id="auth-overlay">
    <div class="card p-4 shadow-lg border-0" style="max-width: 400px; width: 90%; border-radius: 16px;">
      <div class="text-center mb-3">
        <i class="fa-solid fa-lock text-primary fs-1 mb-2"></i>
        <h4 class="fw-bold">後台身分驗證</h4>
        <p class="text-muted fs-7">請輸入管理員密碼以進入系統</p>
      </div>
      <form onsubmit="verifyAdminPassword(event)">
        <div class="mb-3">
          <input type="password" id="admin-pass-input" class="form-control form-control-lg text-center" placeholder="請輸入密碼" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">解鎖進入後台</button>
      </form>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-dark admin-navbar py-3 sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center me-4" href="#">
        <i class="fa-solid fa-store me-2 text-primary fs-4"></i>
        <span class="brand-title">Yves 嚴選特惠後台</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAdmin">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarAdmin">
        <!-- 頁籤按鈕 (已修正 Bootstrap 5 data-bs-toggle) -->
        <ul class="nav nav-tabs border-0 me-auto mb-2 mb-lg-0" id="adminTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-manage" data-bs-toggle="tab" data-bs-target="#pane-manage" type="button" role="tab">
              <i class="fa-solid fa-boxes-packing me-1"></i> 商品管理
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-add" data-bs-toggle="tab" data-bs-target="#pane-add" type="button" role="tab">
              <i class="fa-solid fa-plus-circle me-1"></i> 手動上架
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-logs" data-bs-toggle="tab" data-bs-target="#pane-logs" type="button" role="tab">
              <i class="fa-solid fa-clock-rotate-left me-1"></i> 操作日誌
            </button>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-20 px-3 py-2 rounded-pill">
            <i class="fa-solid fa-shield-halved me-1"></i> Admin SDK 模式
          </span>
          <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="refreshDatabaseData()">
            <i class="fa-solid fa-rotate me-1"></i> 手動重新整理
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主體區域 -->
  <div class="container-fluid px-4 py-4 flex-grow-1">

    <!-- 頂部四項數據指標 -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="metric-card primary p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <p class="text-muted mb-1 fw-bold fs-7">在售商品總數</p>
              <h2 id="metric-total-items" class="fw-bold mb-0">0</h2>
            </div>
            <div class="metric-icon-box bg-primary bg-opacity-10 text-primary">
              <i class="fa-solid fa-box-archive"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-xl-3">
        <div class="metric-card success p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <p class="text-muted mb-1 fw-bold fs-7">全站累積總點擊數</p>
              <h2 id="metric-total-clicks" class="fw-bold mb-0 text-success">0</h2>
            </div>
            <div class="metric-icon-box bg-success bg-opacity-10 text-success">
              <i class="fa-solid fa-chart-line"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- 文字完全顯示無截斷 -->
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="metric-card warning p-3">
          <div class="d-flex align-items-center justify-content-between gap-2">
            <div style="flex-grow: 1;">
              <p class="text-muted mb-1 fw-bold fs-7">點擊冠軍商品</p>
              <h6 id="metric-top-item" class="fw-bold mb-0 text-dark full-text-display">尚無數據</h6>
            </div>
            <div class="metric-icon-box bg-warning bg-opacity-10 text-warning">
              <i class="fa-solid fa-trophy"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-xl-3">
        <div class="metric-card danger p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <p class="text-muted mb-1 fw-bold fs-7">平均轉換估算點擊</p>
              <h2 id="metric-avg-clicks" class="fw-bold mb-0 text-danger">0</h2>
            </div>
            <div class="metric-icon-box bg-danger bg-opacity-10 text-danger">
              <i class="fa-solid fa-bullseye"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 分頁內容區 -->
    <div class="tab-content" id="adminTabContent">

      <!-- 分頁一：商品清單 -->
      <div class="tab-pane fade show active" id="pane-manage" role="tabpanel">
        <div class="panel-card">
          <div class="panel-header d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-2">
              <h5 class="mb-0 fw-bold"><i class="fa-solid fa-table-list text-primary me-2"></i>即時商品清單</h5>
              <span class="badge bg-secondary rounded-pill" id="item-count-badge">0 項</span>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-2">
              <div class="input-group input-group-sm" style="width: 220px;">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" id="search-input" class="form-control border-start-0" placeholder="搜尋商品名稱..." onkeyup="filterProducts()">
              </div>

              <select id="category-filter" class="form-select form-select-sm" style="width: 120px;" onchange="filterProducts()">
                <option value="ALL">所有分類</option>
                <option value="熱門爆款">熱門爆款</option>
                <option value="包包服飾">包包服飾</option>
                <option value="3C數位">3C數位</option>
                <option value="生活用品">生活用品</option>
              </select>

              <button class="btn btn-outline-danger btn-sm" onclick="batchResetClicks()">
                <i class="fa-solid fa-rotate-left me-1"></i> 重置點擊
              </button>
              <button class="btn btn-outline-success btn-sm" onclick="exportToCSV()">
                <i class="fa-solid fa-file-csv me-1"></i> 匯出 CSV
              </button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table custom-table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th class="ps-4" style="width: 60px;">序號</th>
                  <th style="width: 80px;">縮圖</th>
                  <th>商品名稱</th>
                  <th style="width: 120px;">價格</th>
                  <th style="width: 130px;">📊 累積點擊</th>
                  <th>導向網址</th>
                  <th class="text-end pe-4" style="width: 160px;">管理操作</th>
                </tr>
              </thead>
              <tbody id="product-table-body">
                <tr>
                  <td colspan="7" class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                    載入 Firebase 資料庫中...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 分頁二：手動上架 -->
      <div class="tab-pane fade" id="pane-add" role="tabpanel">
        <div class="panel-card mx-auto" style="max-width: 750px;">
          <div class="panel-header">
            <h5 class="mb-0 fw-bold text-primary"><i class="fa-solid fa-plus-circle me-2"></i>手動新增商品至 Firebase</h5>
          </div>
          <div class="card-body p-4">
            <form id="add-product-form" onsubmit="handleManualAddProduct(event)">
              <div class="row g-3">
                <div class="col-12">
                  <label for="new-name" class="form-label fw-bold">商品名稱 *</label>
                  <input type="text" class="form-control" id="new-name" placeholder="請輸入商品品名" required>
                </div>
                <div class="col-md-6">
                  <label for="new-category" class="form-label fw-bold">商品分類</label>
                  <select class="form-select" id="new-category">
                    <option value="熱門爆款" selected>熱門爆款</option>
                    <option value="包包服飾">包包服飾</option>
                    <option value="3C數位">3C數位</option>
                    <option value="生活用品">生活用品</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="new-badge" class="form-label fw-bold">角標文字</label>
                  <input type="text" class="form-control" id="new-badge" value="HOT">
                </div>
                <div class="col-md-6">
                  <label for="new-orig-price" class="form-label fw-bold">原價 (NT$)</label>
                  <input type="number" class="form-control" id="new-orig-price" placeholder="599">
                </div>
                <div class="col-md-6">
                  <label for="new-promo-price" class="form-label fw-bold">特惠價 (NT$) *</label>
                  <input type="number" class="form-control" id="new-promo-price" placeholder="299" required>
                </div>
                <div class="col-12">
                  <label for="new-image" class="form-label fw-bold">圖片網址 (Image URL) *</label>
                  <input type="url" class="form-control" id="new-image" placeholder="https://..." required>
                </div>
                <div class="col-12">
                  <label for="new-link" class="form-label fw-bold">分潤短網址 (Affiliate Link) *</label>
                  <input type="url" class="form-control" id="new-link" placeholder="https://s.shopee.tw/..." required>
                </div>
                <div class="col-12 pt-3">
                  <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">寫入 Firebase 資料庫</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- 分頁三：操作日誌 -->
      <div class="tab-pane fade" id="pane-logs" role="tabpanel">
        <div class="panel-card">
          <div class="panel-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-list-ol me-2 text-primary"></i>系統即時 Log 紀錄</h5>
            <button class="btn btn-outline-secondary btn-sm" onclick="clearLogConsole()">清空紀錄</button>
          </div>
          <div class="card-body">
            <div id="log-console" class="bg-dark text-light p-3 rounded-3 font-monospace fs-7" style="height: 350px; overflow-y: auto;">
              <p class="text-muted mb-1">[SYSTEM] 後台初始化完成...</p>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- 編輯連結 Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-bold"><i class="fa-solid fa-pen-to-square text-primary me-2"></i>修改目標連結</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-3">
          <input type="hidden" id="edit-key">
          <div class="mb-3">
            <label class="form-label text-muted fw-bold fs-7 mb-1">商品名稱</label>
            <div id="edit-name" class="fw-bold text-dark full-text-display"></div>
          </div>
          <div class="mb-2">
            <label for="edit-link" class="form-label text-muted fw-bold fs-7 mb-1">目標導向網址</label>
            <textarea id="edit-link" class="form-control" rows="3" placeholder="https://s.shopee.tw/..."></textarea>
          </div>
        </div>
        <div class="modal-footer border-top-0 pt-0">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary px-4 fw-bold" onclick="saveProductLinkChange()">儲存變更</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container text-center">
      <p class="mb-0 text-muted">© 2026 Yves Shop Admin System.</p>
    </div>
  </footer>

  <!-- 載入必要 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    //預設管理員密碼：admin123 (可自行更換)
    const ADMIN_PASSWORD = "admin123";

    const firebaseConfig = {
      databaseURL: "https://shopee-da43f-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let globalProductsData = [];
    let modalInstance = null;

    // 驗證密碼邏輯
    function verifyAdminPassword(e) {
      e.preventDefault();
      const inputPass = document.getElementById('admin-pass-input').value;
      if (inputPass === ADMIN_PASSWORD) {
        document.getElementById('auth-overlay').style.display = 'none';
        refreshDatabaseData();
      } else {
        alert('密碼錯誤，請重新輸入！');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      modalInstance = new bootstrap.Modal(document.getElementById('editModal'));
    });

    function appendLog(msg, type = 'INFO') {
      const consoleBox = document.getElementById('log-console');
      if (!consoleBox) return;
      const timeStr = new Date().toLocaleTimeString();
      const logLine = document.createElement('p');
      logLine.className = `mb-1 ${type === 'ERROR' ? 'text-danger' : type === 'SUCCESS' ? 'text-success' : 'text-info'}`;
      logLine.innerText = `[${timeStr}] [${type}] ${msg}`;
      consoleBox.appendChild(logLine);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function clearLogConsole() {
      document.getElementById('log-console').innerHTML = '';
    }

    function refreshDatabaseData() {
      const tbody = document.getElementById('product-table-body');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>載入資料庫中...</td></tr>`;

      db.ref('yves_shop_data/products').once('value', (snapshot) => {
        const rawData = snapshot.val();
        if (!rawData) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">無商品資料</td></tr>';
          updateDashboardMetrics(0, 0, '無', 0);
          return;
        }

        globalProductsData = Array.isArray(rawData)
          ? rawData.map((item, index) => [index, item])
          : Object.entries(rawData);

        renderProductTable(globalProductsData);
        appendLog(`載入完成，共 ${globalProductsData.length} 項商品`, 'SUCCESS');
      });
    }

    function renderProductTable(entries) {
      const tbody = document.getElementById('product-table-body');
      tbody.innerHTML = '';

      let totalClicks = 0;
      let topItem = { name: '無', clicks: -1 };
      let validCount = 0;

      entries.forEach(([key, product], idx) => {
        if (!product) return;
        validCount++;

        const clicks = product.clicks || 0;
        totalClicks += clicks;

        if (clicks > topItem.clicks) {
          topItem = { name: product.name, clicks: clicks };
        }

        const safeName = escapeHtml(product.name || '');
        const safeLink = escapeHtml(product.link || '#');
        const imgUrl = product.image || 'https://via.placeholder.com/100';

        const row = `
          <tr>
            <td class="ps-4 text-muted fw-bold">#${idx + 1}</td>
            <td><img src="${imgUrl}" class="product-thumbnail" onerror="this.src='https://via.placeholder.com/100'"></td>
            <td><div class="fw-bold text-dark full-text-display">${safeName}</div></td>
            <td><div class="fw-bold text-danger">NT$ ${product.promoPrice || 0}</div></td>
            <td><span class="badge-click-count"><i class="fa-solid fa-arrow-pointer me-1"></i>${clicks} 次</span></td>
            <td><a href="${safeLink}" target="_blank" class="text-muted fs-7 text-truncate d-inline-block" style="max-width: 160px;">${safeLink}</a></td>
            <td class="text-end pe-4">
              <button class="btn btn-outline-primary btn-sm me-1" onclick="openEditModal('${key}', '${safeName}', '${safeLink}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-outline-danger btn-sm" onclick="deleteProduct('${key}')"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
        tbody.innerHTML += row;
      });

      const avgClicks = validCount > 0 ? (totalClicks / validCount).toFixed(1) : 0;
      updateDashboardMetrics(validCount, totalClicks, topItem.name, avgClicks);
    }

    function updateDashboardMetrics(count, clicks, topName, avg) {
      document.getElementById('metric-total-items').innerText = count;
      document.getElementById('metric-total-clicks').innerText = clicks;
      document.getElementById('metric-top-item').innerText = topName;
      document.getElementById('metric-avg-clicks').innerText = avg;
      document.getElementById('item-count-badge').innerText = `${count} 項`;
    }

    function filterProducts() {
      const keyword = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedCategory = document.getElementById('category-filter').value;

      const filtered = globalProductsData.filter(([key, product]) => {
        if (!product) return false;
        const nameMatch = (product.name || '').toLowerCase().includes(keyword);
        const categoryMatch = selectedCategory === 'ALL' || (product.category || '熱門爆款') === selectedCategory;
        return nameMatch && categoryMatch;
      });

      renderProductTable(filtered);
    }

    function openEditModal(key, name, link) {
      document.getElementById('edit-key').value = key;
      document.getElementById('edit-name').innerText = name;
      document.getElementById('edit-link').value = link;
      modalInstance.show();
    }

    function saveProductLinkChange() {
      const key = document.getElementById('edit-key').value;
      const newLink = document.getElementById('edit-link').value.trim();

      db.ref(`yves_shop_data/products/${key}/link`).set(newLink).then(() => {
        alert('連結更新成功！');
        modalInstance.hide();
        refreshDatabaseData();
      });
    }

    function deleteProduct(key) {
      if (confirm('確定要刪除這項商品嗎？')) {
        db.ref(`yves_shop_data/products/${key}`).remove().then(() => {
          alert('已成功刪除！');
          refreshDatabaseData();
        });
      }
    }

    function batchResetClicks() {
      if (confirm('確定歸零所有點擊數嗎？')) {
        db.ref('yves_shop_data/products').once('value', (snapshot) => {
          const data = snapshot.val();
          if (!data) return;
          if (Array.isArray(data)) {
            data.forEach((p) => { if (p) p.clicks = 0; });
          } else {
            Object.keys(data).forEach((k) => { if (data[k]) data[k].clicks = 0; });
          }
          db.ref('yves_shop_data/products').set(data).then(() => {
            alert('點擊數已重置！');
            refreshDatabaseData();
          });
        });
      }
    }

    function exportToCSV() {
      let csvContent = "data:text/csv;charset=utf-8,\uFEFFID,品名,價格,點擊數,連結\n";
      globalProductsData.forEach(([key, p]) => {
        if (!p) return;
        csvContent += `"${key}","${(p.name||'').replace(/"/g, '""')}",${p.promoPrice||0},${p.clicks||0},"${p.link||''}"\n`;
      });
      const link = document.createElement("a");
      link.href = encodeURI(csvContent);
      link.download = `yves_products_${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
