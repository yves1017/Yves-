<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品後台管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: sans-serif; }
    .table-img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="container py-4">
    <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
      <h1 class="fs-3 fw-bold">⚙️ 商品後台管理</h1>
      <button class="btn btn-primary btn-sm" onclick="fetchProducts()">🔄 重新整理</button>
    </header>

    <div class="card p-3 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>圖片</th>
              <th>商品名稱</th>
              <th>價格</th>
              <th>📊 累積點擊數</th>
              <th>商品連結</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="admin-table-body">
            <tr><td colspan="6" class="text-center py-4">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://shopee-da43f-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function fetchProducts() {
      db.ref('yves_shop_data/products').once('value', (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('admin-table-body');
        tbody.innerHTML = '';

        if (!data) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">目前資料庫無商品資料</td></tr>';
          return;
        }

        const entries = Array.isArray(data) ? data.map((item, idx) => [idx, item]) : Object.entries(data);

        entries.forEach(([key, product]) => {
          if (!product) return;
          const trHtml = `
            <tr>
              <td><img src="${product.image || 'https://via.placeholder.com/50'}" class="table-img"></td>
              <td><strong class="d-inline-block text-truncate" style="max-width: 200px;">${product.name}</strong></td>
              <td class="text-danger fw-bold">NT$ ${product.promoPrice || 0}</td>
              <td><span class="badge bg-info text-dark fs-6">📊 ${product.clicks || 0} 次</span></td>
              <td><a href="${product.link}" target="_blank" class="btn btn-outline-secondary btn-sm">查看</a></td>
              <td>
                <button class="btn btn-danger btn-sm" onclick="deleteProduct('${key}')">刪除</button>
              </td>
            </tr>
          `;
          tbody.innerHTML += trHtml;
        });
      });
    }

    function deleteProduct(key) {
      if (confirm('確定要刪除這項商品嗎？')) {
        db.ref('yves_shop_data/products/' + key).remove().then(() => {
          alert('已刪除！');
          fetchProducts();
        });
      }
    }

    fetchProducts();
  </script>
</body>
</html>
