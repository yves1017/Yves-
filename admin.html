<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yves 嚴選特惠 - 旗艦版後台管理系統</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6.4 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Animate.css 動畫庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --sidebar-bg: #0f172a;
      --card-border-radius: 14px;
      --main-bg: #f8fafc;
    }

    body {
      background-color: var(--main-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #334155;
      min-height: 100vh;
    }

    /* 頂部導覽列 */
    .admin-navbar {
      background: var(--sidebar-bg);
      border-bottom: 1px solid #1e293b;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 統計指標卡片 */
    .metric-card {
      border: none;
      border-radius: var(--card-border-radius);
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .metric-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    .metric-card.primary::before { background-color: #3b82f6; }
    .metric-card.success::before { background-color: #10b981; }
    .metric-card.warning::before { background-color: #f59e0b; }
    .metric-card.danger::before { background-color: #ef4444; }

    .metric-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    /* 主要卡片與區塊 */
    .panel-card {
      border: none;
      border-radius: var(--card-border-radius);
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      margin-bottom: 2rem;
    }

    .panel-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #f1f5f9;
      background-color: #ffffff;
      border-top-left-radius: var(--card-border-radius);
      border-top-right-radius: var(--card-border-radius);
    }

    /* 表格樣式優化 */
    .custom-table {
      margin-bottom: 0;
    }

    .custom-table th {
      background-color: #f8fafc;
      color: #64748b;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 1rem 0.75rem;
      border-bottom: 2px solid #e2e8f0;
    }

    .custom-table td {
      padding: 1.1rem 0.75rem;
      vertical-align: middle;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.92rem;
    }

    .product-thumbnail {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background-color: #f8fafc;
    }

    .badge-click-count {
      background-color: #eff6ff;
      color: #1d4ed8;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      border: 1px solid #dbeafe;
    }

    .badge-platform {
      background-color: #fff7ed;
      color: #ea580c;
      border: 1px solid #ffedd5;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .action-btn-group .btn {
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
    }

    /* 頁籤專屬樣式 */
    .nav-tabs .nav-link {
      color: #64748b;
      font-weight: 600;
      border: none;
      padding: 0.75rem 1.25rem;
      border-bottom: 3px solid transparent;
    }

    .nav-tabs .nav-link.active {
      color: #2563eb;
      background: transparent;
      border-bottom-color: #2563eb;
    }

    /* 頁尾 */
    footer {
      margin-top: auto;
      padding: 1.5rem 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body class="d-flex flex-column">

  <!-- 頂部導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-dark admin-navbar py-3 sticky-top">
    <div class="container-fluid px-4">

        <i class="fa-solid fa-store me-2 text-primary fs-4"></i>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAdmin">
        <span class="navbar-toggler-icon"></span>

      <div class="collapse navbar-collapse" id="navbarAdmin">

    <!-- 頂部四項核心統計指標 -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="metric-card primary p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <p class="text-muted mb-1 fw-bold fs-7">在售商品總數</p>

        </div>

      <div class="col-12 col-sm-6 col-xl-3">
        <div class="metric-card success p-3">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <p class="text-muted mb-1 fw-bold fs-7">全站累積總點擊數</p>

            </div>
            <div class="metric-icon-box bg-success bg-opacity-10 text-success">

  <!-- 編輯連結 Modal -->

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <!-- Firebase 8.10.1 SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ----------------------------------------------------
    // 1. 初始化 Firebase Realtime Database
    // ----------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://shopee-da43f-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let globalProductsData = [];
    let modalInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      modalInstance = new bootstrap.Modal(document.getElementById('editModal'));
      refreshDatabaseData();
    });

    // ----------------------------------------------------
    // 2. 寫入控制台 Log 紀錄
    // ----------------------------------------------------
    function appendLog(msg, type = 'INFO') {
      const consoleBox = document.getElementById('log-console');
      const timeStr = new Date().toLocaleTimeString();
      let colorClass = 'text-info';
      if (type === 'WARN') colorClass = 'text-warning';
      if (type === 'ERROR') colorClass = 'text-danger';
      if (type === 'SUCCESS') colorClass = 'text-success';

      const logLine = document.createElement('p');
      logLine.className = `mb-1 ${colorClass}`;
      logLine.innerText = `[${timeStr}] [${type}] ${msg}`;
      consoleBox.appendChild(logLine);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function clearLogConsole() {
      document.getElementById('log-console').innerHTML = '';
      appendLog('控制台日誌已清空', 'INFO');
    }

    // ----------------------------------------------------
    // 3. 讀取 Firebase 主資料庫
    // ----------------------------------------------------
    function refreshDatabaseData() {
      const tbody = document.getElementById('product-table-body');
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
            同步 Firebase 資料庫中...
          </td>
        </tr>
      `;

      appendLog('開始向 Firebase 請求 yves_shop_data/products 資料...', 'INFO');

      db.ref('yves_shop_data/products').once('value', (snapshot) => {
        const rawData = snapshot.val();
        tbody.innerHTML = '';

        if (!rawData) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">目前資料庫內無任何商品資料。</td></tr>';
          updateDashboardMetrics([], 0, 0, '無', 0);
          appendLog('讀取完成：資料庫目前為空', 'WARN');
          return;
        }

        // 自動轉相容 Key-Value 結構
        globalProductsData = Array.isArray(rawData)
          ? rawData.map((item, index) => [index, item])
          : Object.entries(rawData);

        renderProductTable(globalProductsData);
        appendLog(`讀取成功：共載入 ${globalProductsData.length} 項商品資料`, 'SUCCESS');
      }, (error) => {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-danger">讀取失敗：${error.message}</td></tr>`;
        appendLog(`讀取失敗：${error.message}`, 'ERROR');
      });
    }

    // ----------------------------------------------------
    // 4. 渲染商品表格與儀表板數據
    // ----------------------------------------------------
    function renderProductTable(entries) {
      const tbody = document.getElementById('product-table-body');
      tbody.innerHTML = '';

      let totalClicks = 0;
      let topItem = { name: '無', clicks: -1 };
      let validCount = 0;

      entries.forEach(([key, product], idx) => {
        if (!product) return;
        validCount++;

        const clicks = product.clicks || 0;
        totalClicks += clicks;

        if (clicks > topItem.clicks) {
          topItem = { name: product.name, clicks: clicks };
        }

        const safeName = escapeHtml(product.name || '未命名商品');
        const safeLink = escapeHtml(product.link || '#');
        const imgUrl = product.image || 'https://via.placeholder.com/100?text=No+Image';
        const category = product.category || '熱門爆款';

        const row = `
          <tr>
            <td class="ps-4 text-muted fw-bold">#${idx + 1}</td>
            <td>
              <img src="${imgUrl}" class="product-thumbnail" alt="圖示" onerror="this.src='https://via.placeholder.com/100?text=Error'">
            </td>
            <td>
              <span class="badge-platform me-1">${category}</span>
              <strong class="d-inline-block text-truncate fw-bold text-dark align-middle" style="max-width: 260px;" title="${safeName}">
                ${safeName}
              </strong>
            </td>
            <td>
              <div class="fw-bold text-danger">NT$ ${product.promoPrice || 0}</div>
              ${product.originalPrice ? `<small class="text-muted text-decoration-line-through">NT$ ${product.originalPrice}</small>` : ''}
            </td>
            <td>
              <span class="badge-click-count"><i class="fa-solid fa-arrow-pointer me-1"></i>${clicks} 次</span>
            </td>
            <td>
              <a href="${safeLink}" target="_blank" class="text-decoration-none text-truncate d-inline-block text-muted fs-7" style="max-width: 180px;">
                ${safeLink}
              </a>
            </td>
            <td class="text-end pe-4 action-btn-group">
              <button class="btn btn-outline-primary me-1" onclick="openEditModal('${key}', '${safeName}', '${safeLink}')">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="btn btn-outline-danger" onclick="deleteProduct('${key}')">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        `;
        tbody.innerHTML += row;
      });

      const avgClicks = validCount > 0 ? (totalClicks / validCount).toFixed(1) : 0;
      updateDashboardMetrics(validCount, totalClicks, topItem.name, avgClicks);
    }

    // 更新儀表板數據
    function updateDashboardMetrics(count, clicks, topName, avg) {
      document.getElementById('metric-total-items').innerText = count;
      document.getElementById('metric-total-clicks').innerText = clicks;
      document.getElementById('metric-top-item').innerText = topName;
      document.getElementById('metric-avg-clicks').innerText = avg;
      document.getElementById('item-count-badge').innerText = `${count} 項`;
    }

    // ----------------------------------------------------
    // 5. 即時關鍵字搜尋與分類篩選
    // ----------------------------------------------------
    function filterProducts() {
      const keyword = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedCategory = document.getElementById('category-filter').value;

      const filtered = globalProductsData.filter(([key, product]) => {
        if (!product) return false;
        const nameMatch = (product.name || '').toLowerCase().includes(keyword);
        const categoryMatch = selectedCategory === 'ALL' || (product.category || '熱門爆款') === selectedCategory;
        return nameMatch && categoryMatch;
      });

      renderProductTable(filtered);
    }

    // ----------------------------------------------------
    // 6. 手動新增商品處理
    // ----------------------------------------------------
    function handleManualAddProduct(e) {
      e.preventDefault();

      const name = document.getElementById('new-name').value.trim();
      const category = document.getElementById('new-category').value;
      const badge = document.getElementById('new-badge').value.trim() || 'HOT';
      const origPrice = parseInt(document.getElementById('new-orig-price').value) || 0;
      const promoPrice = parseInt(document.getElementById('new-promo-price').value) || 0;
      const image = document.getElementById('new-image').value.trim();
      const link = document.getElementById('new-link').value.trim();

      const newProductObj = {
        id: Date.now(),
        name: name,
        category: category,
        badge: badge,
        originalPrice: origPrice,
        promoPrice: promoPrice,
        image: image,
        link: link,
        platform: "SHOPEE",
        clicks: 0
      };

      appendLog(`嘗試新增商品：${name}`, 'INFO');

      // 取得目前商品列表並插入於頂部
      db.ref('yves_shop_data/products').once('value', (snapshot) => {
        let currentList = snapshot.val() || [];
        if (!Array.isArray(currentList)) {
          currentList = [];
        }
        currentList.unshift(newProductObj);

        db.ref('yves_shop_data/products').set(currentList).then(() => {
          alert('✅ 商品已成功上架至 Firebase！');
          appendLog(`商品【${name}】上架成功`, 'SUCCESS');
          document.getElementById('add-product-form').reset();

          // 切換回管理頁籤並重整理
          const manageTab = new bootstrap.Tab(document.getElementById('tab-manage'));
          manageTab.show();
          refreshDatabaseData();
        }).catch((err) => {
          alert('❌ 上架失敗：' + err.message);
          appendLog(`上架失敗：${err.message}`, 'ERROR');
        });
      });
    }

    // ----------------------------------------------------
    // 7. 編輯與刪除操作
    // ----------------------------------------------------
    function openEditModal(key, name, link) {
      document.getElementById('edit-key').value = key;
      document.getElementById('edit-name').value = name;
      document.getElementById('edit-link').value = link;
      modalInstance.show();
    }

    function saveProductLinkChange() {
      const key = document.getElementById('edit-key').value;
      const newLink = document.getElementById('edit-link').value.trim();

      if (!newLink) {
        alert('連結欄位不可留空！');
        return;
      }

      db.ref(`yves_shop_data/products/${key}/link`).set(newLink).then(() => {
        alert('✅ 連結已成功更新！');
        appendLog(`更新 Key [${key}] 的導向連結至: ${newLink}`, 'SUCCESS');
        modalInstance.hide();
        refreshDatabaseData();
      }).catch((err) => {
        alert('更新失敗：' + err.message);
        appendLog(`更新失敗: ${err.message}`, 'ERROR');
      });
    }

    function deleteProduct(key) {
      if (confirm('確定要從資料庫刪除此項商品嗎？')) {
        db.ref(`yves_shop_data/products/${key}`).remove().then(() => {
          alert('✅ 商品已成功刪除！');
          appendLog(`刪除商品 Key [${key}] 成功`, 'WARN');
          refreshDatabaseData();
        }).catch((err) => {
          alert('刪除失敗：' + err.message);
          appendLog(`刪除失敗: ${err.message}`, 'ERROR');
        });
      }
    }

    // 批次重置全站點擊數
    function batchResetClicks() {
      if (confirm('⚠️ 警告：這將會把所有商品的累積點擊次數歸零，確定執行嗎？')) {
        db.ref('yves_shop_data/products').once('value', (snapshot) => {
          const data = snapshot.val();
          if (!data) return;

          if (Array.isArray(data)) {
            data.forEach((p) => { if (p) p.clicks = 0; });
          } else {
            Object.keys(data).forEach((k) => { if (data[k]) data[k].clicks = 0; });
          }

          db.ref('yves_shop_data/products').set(data).then(() => {
            alert('✅ 所有點擊數已歸零！');
            appendLog('全站商品點擊數重置完成', 'WARN');
            refreshDatabaseData();
          });
        });
      }
    }

    // ----------------------------------------------------
    // 8. CSV 資料匯出功能
    // ----------------------------------------------------
    function exportToCSV() {
      if (!globalProductsData || globalProductsData.length === 0) {
        alert('目前無可匯出的商品資料！');
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += "ID,商品名稱,分類,角標,原價,特價,點擊數,分潤連結\n";

      globalProductsData.forEach(([key, p]) => {
        if (!p) return;
        const row = [
          p.id || key,
          `"${(p.name || '').replace(/"/g, '""')}"`,
          `"${p.category || '熱門爆款'}"`,
          `"${p.badge || 'HOT'}"`,
          p.originalPrice || 0,
          p.promoPrice || 0,
          p.clicks || 0,
          `"${p.link || ''}"`
        ].join(",");
        csvContent += row + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `yves_products_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      appendLog('已成功匯出商品資料至 CSV 檔案', 'SUCCESS');
    }

    // 字串安全性跳脫
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
