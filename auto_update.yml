name: 自動更新爆款商品排程

on:
  schedule:
    # 改為每 30 分鐘執行一次（GitHub 對 30 分鐘以上的排程回應最穩定）
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  auto-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin

      - name: 執行全自動抓取腳本
        run: python auto_fetch.py
