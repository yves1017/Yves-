name: 自動更新爆款商品排程

on:
  schedule:
    # 設定每 10 分鐘自動執行一次
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁介面上手動點擊按鈕觸發

jobs:
  auto-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin

      - name: 執行全自動抓取腳本
        run: python auto_fetch.py
