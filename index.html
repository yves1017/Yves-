<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爆款商品推薦</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: sans-serif; }
    .product-card { border: none; border-radius: 12px; background: #fff; overflow: hidden; height: 100%; }
    .product-img { width: 100%; height: 220px; object-fit: cover; }
    .price-tag { color: #ee4d2d; font-weight: bold; font-size: 1.3rem; }
    .btn-buy { background-color: #ee4d2d; color: white; font-weight: bold; width: 100%; border: none; padding: 10px; border-radius: 6px; }
    .btn-buy:hover { background-color: #d73211; color: white; }
  </style>
</head>
<body>

  <div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
      <h1 class="fs-3 fw-bold text-danger">🔥 今日熱門爆款推薦</h1>
    </header>

    <div id="product-list" class="row row-cols-1 row-cols-md-3 g-4">
      <div class="col-12 text-center py-5">
        <p class="text-muted">載入商品中...</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://shopee-da43f-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function handleProductClick(key, targetUrl) {
      if (!targetUrl) return;
      const productRef = db.ref('yves_shop_data/products/' + key);
      productRef.child('clicks').transaction((clicks) => {
        return (clicks || 0) + 1;
      }).then(() => {
        window.open(targetUrl, '_blank');
      }).catch(() => {
        window.open(targetUrl, '_blank');
      });
    }

    db.ref('yves_shop_data/products').on('value', (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('product-list');
      container.innerHTML = '';

      if (!data) {
        container.innerHTML = '<div class="col-12 text-center text-muted">目前暫無商品（請至 GitHub Actions 執行 Run workflow 抓取）</div>';
        return;
      }

      const entries = Array.isArray(data) ? data.map((item, idx) => [idx, item]) : Object.entries(data);

      entries.forEach(([key, product]) => {
        if (!product) return;
        const cardHtml = `
          <div class="col">
            <div class="card product-card shadow-sm">
              <img src="${product.image \vert{}\vert{} 'https://via.placeholder.com/300'}" class="product-img" alt="${product.name}">
              <div class="card-body d-flex flex-column">
                <span class="badge bg-danger mb-2 align-self-start">${product.badge || 'HOT'}</span>
                <h5 class="card-title fs-6 text-truncate" style="max-width: 100%;">${product.name}</h5>
                <div class="mt-auto pt-3">
                  <div class="price-tag mb-2">NT$ ${product.promoPrice || 0}</div>
                  <button class="btn btn-buy" onclick="handleProductClick('${key}', '${product.link}')">
                    👉 前往購買
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      });
    });
  </script>
</body>
</html>
