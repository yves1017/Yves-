<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熱銷爆款商品推薦</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #ee4d2d;
      --hover-color: #d73211;
      --bg-color: #f5f5f5;
    }
    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar-brand {
      font-weight: 800;
      color: var(--primary-color) !important;
      font-size: 1.5rem;
    }
    .hero-banner {
      background: linear-gradient(135deg, #ff7337 0%, #ee4d2d 100%);
      color: white;
      padding: 2.5rem 1rem;
      border-radius: 16px;
      margin-bottom: 2rem;
      box-shadow: 0 10px 20px rgba(238, 77, 45, 0.2);
    }
    .product-card {
      border: none;
      border-radius: 12px;
      transition: all 0.25s ease-in-out;
      background: #ffffff;
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
    }
    .img-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%; /* 1:1 正方形比例 */
      overflow: hidden;
      background-color: #eaeaea;
    }
    .product-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .product-card:hover .product-img {
      transform: scale(1.05);
    }
    .badge-hot {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: var(--primary-color);
      color: white;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .product-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      color: #333333;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 2.7rem;
      margin-bottom: 0.75rem;
    }
    .price-container {
      margin-top: auto;
      padding-top: 0.5rem;
    }
    .promo-price {
      color: var(--primary-color);
      font-size: 1.35rem;
      font-weight: 800;
    }
    .original-price {
      color: #999999;
      text-decoration: line-through;
      font-size: 0.85rem;
      margin-left: 6px;
    }
    .btn-buy {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
      width: 100%;
      margin-top: 0.75rem;
    }
    .btn-buy:hover {
      background-color: var(--hover-color);
      color: white;
    }
    footer {
      margin-top: auto;
      background-color: #ffffff;
      border-top: 1px solid #e9ecef;
      padding: 1.5rem 0;
      color: #6c757d;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="fa-solid fa-bag-shopping me-2"></i>Yves爆款嚴選</a>
      <span class="navbar-text fs-6 text-muted">每日即時更新熱門商品</span>
    </div>
  </nav>

  <!-- 主要內容區塊 -->
  <main class="container my-4">
    <div class="hero-banner text-center">
      <h1 class="fw-bold mb-2">🔥 本週限時爆款折扣專區</h1>
      <p class="mb-0 fs-6 opacity-90">嚴選熱銷排行榜商品，點擊即可享限時優惠！</p>
    </div>

    <!-- 商品列表卡片容器 -->
    <div id="product-list" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-danger" role="status" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-3 text-muted fw-bold">正在載入最新商品清單...</p>
      </div>
    </div>
  </main>

  <!-- 頁尾 -->
  <footer class="text-center">
    <div class="container">
      <p class="mb-0">© 2026 Yves Shop. All rights reserved.</p>
    </div>
  </footer>

  <!-- 載入 Firebase 8.x SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // 1. 初始化 Firebase Realtime Database
    const firebaseConfig = {
      databaseURL: "https://shopee-da43f-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. 點擊數原子累加 (+1) 並進行跳轉
    function handleProductClick(productId, targetUrl) {
      if (!targetUrl || targetUrl === '#') {
        alert('無效的商品連結');
        return;
      }

      const productRef = db.ref('yves_shop_data/products/' + productId);

      // 使用 Firebase Transaction 確保點擊次數準確加算
      productRef.child('clicks').transaction((currentClicks) => {
        return (currentClicks || 0) + 1;
      }).then(() => {
        window.open(targetUrl, '_blank');
      }).catch((err) => {
        console.error("點擊計數更新發生異常：", err);
        window.open(targetUrl, '_blank');
      });
    }

    // 3. 監聽 Firebase 資料庫變化並即時渲染畫面
    db.ref('yves_shop_data/products').on('value', (snapshot) => {
      const products = snapshot.val() || [];
      const container = document.getElementById('product-list');
      container.innerHTML = '';

      if (!products || products.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="fa-solid fa-box-open text-muted fs-1 mb-3"></i>
            <p class="text-muted fs-5">目前暫無上架商品，請稍後再來！</p>
          </div>
        `;
        return;
      }

      products.forEach((product, index) => {
        if (!product) return;

        const badgeText = product.badge || 'HOT';
        const imgUrl = product.image || 'https://via.placeholder.com/600?text=No+Image';
        const origPriceHtml = product.originalPrice && product.originalPrice > product.promoPrice 
          ? `<span class="original-price">NT$ ${product.originalPrice}</span>` 
          : '';

        const cardHtml = `
          <div class="col">
            <div class="card product-card">
              <div class="img-wrapper">
                <img src="${imgUrl}" class="product-img" alt="${product.name}" onerror="this.src='https://via.placeholder.com/600?text=Image+Error'">
                <span class="badge-hot">${badgeText}</span>
              </div>
              <div class="card-body">
                <h5 class="product-title" title="${product.name}">${product.name}</h5>
                <div class="price-container">
                  <div>
                    <span class="promo-price">NT$ ${product.promoPrice || 0}</span>
                    ${origPriceHtml}
                  </div>
                  <button class="btn btn-buy shadow-sm" onclick="handleProductClick(${index}, '${product.link}')">
                    <i class="fa-solid fa-cart-shopping me-1"></i> 前往購買
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      });
    }, (error) => {
      console.error("Firebase 讀取失敗：", error);
      document.getElementById('product-list').innerHTML = `
        <div class="col-12 text-center py-5 text-danger">
          <i class="fa-solid fa-triangle-exclamation fs-1 mb-2"></i>
          <p>載入商品失敗，請檢查網路連線或權限設定。</p>
        </div>
      `;
    });
  </script>
</body>
</html>
