  <script>
    function sanitize(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBcI0OjXhHwOMsr_HhubzfLlVf_9wVcERI",
      authDomain: "shopee-da43f.firebaseapp.com",
      databaseURL: "https://shopee-da43f-default-rtdb.firebaseio.com",
      projectId: "shopee-da43f",
      storageBucket: "shopee-da43f.firebasestorage.app",
      messagingSenderId: "669756265345",
      appId: "1:669756265345:web:b55f67923b1b81687f0e80",
      measurementId: "G-Z8SZ67GGTC"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentPlatform = 'ALL';
    let currentCategory = 'ALL';
    let storeData = { products: [], codes: [], lastUpdated: null };

    db.ref('yves_shop_data').on('value', (snapshot) => {
      const val = snapshot.val();
      if (val) {
        storeData.products = val.products || [];
        storeData.codes = val.codes || [];
        storeData.lastUpdated = val.lastUpdated || null;
      } else {
        storeData = { products: [], codes: [], lastUpdated: null };
      }
      renderStorefront();
    });

    setInterval(updateCountdowns, 1000);

    function setPlatform(platform) {
      currentPlatform = platform;
      ['ALL', 'SHOPEE', 'COUPANG'].forEach(p => {
        const btn = document.getElementById(`tab-${p}`);
        if (btn) {
          btn.className = p === platform 
            ? "flex-1 py-2 text-xs sm:text-sm font-bold rounded-lg transition-all shadow-sm bg-white text-gray-800"
            : "flex-1 py-2 text-xs sm:text-sm font-bold rounded-lg transition-all text-gray-500 hover:text-gray-900";
        }
      });
      renderStorefront();
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderStorefront();
    }

    function quickSearch(keyword) {
      const input = document.getElementById('search-input');
      if (input) {
        input.value = keyword;
        renderStorefront();
      }
    }

    function renderCategoryBar() {
      const catContainer = document.getElementById('category-bar-container');
      if (!catContainer) return;

      const existingCategories = Array.from(new Set(
        (storeData.products || [])
          .map(p => (p.category || '').trim())
          .filter(c => c !== '')
      ));

      let categoriesToDisplay = ['ALL', ...existingCategories];
      if (!categoriesToDisplay.includes(currentCategory)) {
        currentCategory = 'ALL';
      }

      catContainer.innerHTML = categoriesToDisplay.map(cat => {
        const isActive = cat === currentCategory;
        const displayName = cat === 'ALL' ? '全部' : sanitize(cat);
        return `
          <button onclick="setCategory('${sanitize(cat)}')" class="px-3 py-1.5 rounded-lg font-bold flex-shrink-0 transition-all text-xs ${
            isActive 
              ? 'bg-orange-500 text-white shadow-sm' 
              : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
          }">
            ${displayName}
          </button>
        `;
      }).join('');
    }

    function isExpired(expiryStr) {
      if (!expiryStr) return false;
      const expiryTime = new Date(expiryStr).getTime();
      const now = new Date().getTime();
      return expiryTime <= now;
    }

    function trackClick(productId) {
      if (!productId) return;
      const p = storeData.products.find(x => x.id === productId);
      if (p) {
        p.clicks = (p.clicks || 0) + 1;
        db.ref('yves_shop_data/products').set(storeData.products);
      }
    }

    // 關鍵升級：手機 Deep Link 跳轉處理
    function openAppOrUrl(url, platform) {
      if (!url || url === '#' || url === 'undefined') return;

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      
      if (isMobile) {
        let appUrl = url;
        if (platform === 'SHOPEE' && url.includes('shopee.tw')) {
          appUrl = url.replace('https://shopee.tw/', 'shopee://');
        } else if (platform === 'COUPANG' && url.includes('coupang.com')) {
          appUrl = url.replace('https://', 'coupang://');
        }

        const now = Date.now();
        window.location.href = appUrl;
        
        // 若沒有安裝 App 則在 1.5 秒後備用切回網頁版
        setTimeout(() => {
          if (Date.now() - now < 2000) {
            window.open(url, '_blank', 'noopener,noreferrer');
          }
        }, 1500);
      } else {
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    function renderStorefront() {
      const updateStr = storeData.lastUpdated ? sanitize(storeData.lastUpdated) : '尚無更新紀錄';
      document.getElementById('last-updated-tag').innerText = `最後更新：${updateStr}`;
      document.getElementById('last-updated-footer').innerText = `最後更新時間：${updateStr}`;

      renderCategoryBar();

      const searchInput = document.getElementById('search-input');
      const searchKeyword = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const promoContainer = document.getElementById('promo-codes-container');
      
      const activeCodes = (storeData.codes || []).filter(c => c.active && !isExpired(c.expiry));
      
      if (promoContainer) {
        promoContainer.innerHTML = activeCodes.length === 0 
          ? `<div class="col-span-full text-center py-2 text-xs text-orange-100">目前尚無獨家優惠碼</div>`
          : activeCodes.map(c => `
            <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-2.5 sm:p-3 flex flex-col justify-between text-white space-y-2">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <span class="text-[9px] sm:text-[10px] uppercase tracking-wider font-extrabold px-1.5 py-0.5 rounded ${c.platform === 'SHOPEE' ? 'bg-orange-500/90' : 'bg-blue-500/90'}">${sanitize(c.platform)}</span>
                  <p class="text-xs font-semibold mt-1">${sanitize(c.desc)}</p>
                </div>
                <button onclick="copyAndRedirect('${sanitize(c.code)}', '${sanitize(c.link)}', null, '${c.platform}')" class="px-2.5 py-1.5 bg-yellow-400 active:bg-yellow-300 text-gray-900 font-black text-xs rounded-lg shadow transition-all active:scale-95 flex-shrink-0">
                  ${sanitize(c.code)} <i class="fa-regular fa-copy ml-1"></i>
                </button>
              </div>
              
              ${c.expiry ? `<div class="text-[10px] bg-black/50 text-yellow-300 px-2.5 py-1.5 rounded font-mono font-extrabold border border-yellow-400/30 shadow-sm countdown-timer" data-expiry="${sanitize(c.expiry)}">⏳ 載入倒數...</div>` : ''}

              ${c.link ? `
                <button onclick="openAppOrUrl('${sanitize(c.link)}', '${c.platform}')" class="w-full py-1.5 bg-white/20 active:bg-white/30 text-white font-bold text-[11px] rounded-lg text-center transition-all flex items-center justify-center gap-1">
                  <i class="fa-solid fa-link text-[10px]"></i> 前往領券頁面
                </button>
              ` : ''}
            </div>
          `).join('');
      }

      const sortedByClicks = [...(storeData.products || [])].sort((a, b) => (b.clicks || 0) - (a.clicks || 0));
      const top1Id = sortedByClicks[0]?.clicks > 0 ? sortedByClicks[0]?.id : null;
      const top2Id = sortedByClicks[1]?.clicks > 0 ? sortedByClicks[1]?.id : null;
      const top3Id = sortedByClicks[2]?.clicks > 0 ? sortedByClicks[2]?.id : null;

      const filtered = (storeData.products || []).filter(p => {
        if (isExpired(p.expiry)) return false;
        const matchPlatform = currentPlatform === 'ALL' || p.platform === currentPlatform;
        const matchCategory = currentCategory === 'ALL' || (p.category || '').trim() === currentCategory;
        const matchSearch = (p.name || '').toLowerCase().includes(searchKeyword) || (p.category || '').toLowerCase().includes(searchKeyword);
        return matchPlatform && matchCategory && matchSearch;
      });

      const grid = document.getElementById('product-grid');
      if (grid) {
        grid.innerHTML = filtered.length === 0 
          ? `<div class="col-span-full py-12 text-center text-gray-400"><i class="fa-solid fa-box-open text-3xl mb-2"></i><p class="text-xs">沒有找到符合的商品</p></div>`
          : filtered.map(p => {
            const orig = p.originalPrice || 0;
            const promo = p.promoPrice || 0;
            const saveAmount = orig > promo ? orig - promo : 0;
            const discount = orig > 0 ? Math.round((1 - promo / orig) * 100) : 0;
            const isShopee = p.platform === 'SHOPEE';
            
            let badgeHtml = '';
            if (p.id === top1Id) badgeHtml = `<span class="absolute top-1.5 right-1.5 px-1.5 py-0.5 rounded-md text-[9px] font-black bg-amber-400 text-gray-900 shadow-md">🏆 熱銷 NO.1</span>`;
            else if (p.id === top2Id) badgeHtml = `<span class="absolute top-1.5 right-1.5 px-1.5 py-0.5 rounded-md text-[9px] font-black bg-slate-300 text-gray-900 shadow-md">🥈 熱銷 NO.2</span>`;
            else if (p.id === top3Id) badgeHtml = `<span class="absolute top-1.5 right-1.5 px-1.5 py-0.5 rounded-md text-[9px] font-black bg-amber-700 text-white shadow-md">🥉 熱銷 NO.3</span>`;
            else if (p.badge === 'HOT') badgeHtml = `<span class="absolute top-1.5 right-1.5 px-1.5 py-0.5 rounded-md text-[9px] font-black bg-rose-600 text-white shadow-md">🔥 熱銷爆款</span>`;
            else if (p.badge === 'FLASH') badgeHtml = `<span class="absolute top-1.5 right-1.5 px-1.5 py-0.5 rounded-md text-[9px] font-black bg-amber-500 text-white shadow-md">⚡ 限時直降</span>`;
            else if (p.badge === 'NEW') badgeHtml = `<span class="absolute top-1.5 right-1.5 px-1.5 py-0.5 rounded-md text-[9px] font-black bg-emerald-600 text-white shadow-md">✨ 新上架</span>`;
            else if (discount > 0) badgeHtml = `<span class="absolute top-1.5 right-1.5 px-1.5 py-0.5 rounded-md text-[9px] font-black bg-red-600 text-white shadow-md">-${discount}%</span>`;

            return `
              <div class="group bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-lg transition-all duration-300 flex flex-col justify-between">
                <div class="relative aspect-square overflow-hidden bg-gray-100">
                  <img src="${sanitize(p.image)}" alt="${sanitize(p.name)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                  <span class="absolute top-1.5 left-1.5 px-2 py-0.5 rounded-md text-[9px] font-black text-white shadow-md ${isShopee ? 'bg-orange-600' : 'bg-blue-600'}">${isShopee ? '蝦皮' : '酷澎'}</span>
                  ${badgeHtml}
                </div>
                <div class="p-2.5 sm:p-4 flex-grow flex flex-col justify-between space-y-2.5">
                  <div>
                    <div class="flex justify-between items-center">
                      <span class="text-[9px] font-bold text-gray-400 uppercase tracking-wider">${sanitize(p.category || '精選商品')}</span>
                      ${saveAmount > 0 ? `<span class="text-[9px] font-black text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">省 $${saveAmount}</span>` : ''}
                    </div>
                    <h3 class="text-xs sm:text-sm font-bold text-gray-800 line-clamp-2 mt-0.5 group-hover:text-orange-600 transition-colors">${sanitize(p.name)}</h3>
                  </div>
                  <div>
                    <div class="flex items-baseline gap-1.5">
                      <span class="text-sm sm:text-lg font-black text-red-600">NT$ ${promo}</span>
                      <span class="text-[10px] sm:text-xs text-gray-400 line-through">NT$ ${orig}</span>
                    </div>
                    
                    ${p.expiry ? `<div class="mt-1.5 text-[10px] bg-rose-100/90 text-rose-700 px-2.5 py-1.5 rounded-md border border-rose-300 font-mono font-extrabold shadow-sm countdown-timer" data-expiry="${sanitize(p.expiry)}">⏳ 載入倒數...</div>` : ''}
                    ${p.code ? `<div class="mt-1 text-[10px] sm:text-[11px] bg-orange-50 text-orange-700 px-1.5 py-1 rounded border border-orange-200 flex justify-between items-center"><span>券碼: <strong>${sanitize(p.code)}</strong></span><button onclick="copyAndRedirect('${sanitize(p.code)}', '${sanitize(p.link)}', ${p.id}, '${p.platform}')" class="text-orange-600 font-bold hover:underline">複製並前往</button></div>` : ''}
                    
                    <div class="mt-2.5 flex gap-1.5">
                      <button onclick="handlePurchaseClick(${p.id}, '${sanitize(p.link)}', '${p.platform}')" class="flex-grow py-2 rounded-xl font-bold text-[11px] sm:text-xs flex items-center justify-center gap-1 transition-all shadow-sm ${isShopee ? 'bg-orange-500 active:bg-orange-600 text-white' : 'bg-blue-600 active:bg-blue-700 text-white'}">前往購買 <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i></button>
                      <button onclick="shareProduct('${sanitize(p.name)}', '${p.promoPrice}', '${sanitize(p.link)}')" class="px-2.5 py-2 bg-gray-100 active:bg-gray-200 text-gray-600 rounded-xl text-xs font-bold transition-all" title="分享商品"><i class="fa-solid fa-share-nodes"></i></button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('');
      }
      updateCountdowns();
    }

    function handlePurchaseClick(id, link, platform) {
      trackClick(id);
      openAppOrUrl(link, platform);
    }

    function updateCountdowns() {
      let hasExpired = false;
      document.querySelectorAll('.countdown-timer').forEach(el => {
        const expiryTime = new Date(el.getAttribute('data-expiry')).getTime();
        const now = new Date().getTime();
        const diff = expiryTime - now;

        if (diff <= 0) {
          hasExpired = true;
        } else {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const secs = Math.floor((diff % (1000 * 60)) / 1000);
          el.innerText = `⏳ 剩餘 ${days > 0 ? days + '天 ' : ''}${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        }
      });

      if (hasExpired) {
        renderStorefront();
      }
    }

    function copyAndRedirect(code, targetUrl, productId, platform) {
      if (productId) trackClick(productId);
      if (code) {
        navigator.clipboard.writeText(code);
      }
      if (targetUrl && targetUrl !== 'undefined' && targetUrl !== '') {
        alert(`✅ 優惠碼 [${code || '無'}] 已複製！\n即將為您前往專屬購買頁面。`);
        openAppOrUrl(targetUrl, platform);
      } else {
        alert(`✅ 優惠碼 [${code}] 已複製到剪貼簿！`);
      }
    }

    function copyAllPromoCodes() {
      const activeCodes = (storeData.codes || []).filter(c => c.active && !isExpired(c.expiry));
      if (activeCodes.length === 0) {
        alert('目前沒有可用的優惠碼');
        return;
      }
      const allStr = activeCodes.map(c => `${c.platform}: ${c.code} (${c.desc})`).join('\n');
      navigator.clipboard.writeText(allStr);
      alert(`✅ 已一次複製全站 ${activeCodes.length} 組獨家優惠碼！`);
    }

    function shareProduct(title, price, url) {
      const shareText = `🔥【Yves 嚴選好康】${title}\n💰 限時破盤價：NT$ ${price}\n👉 最便宜購買連結：`;
      if (navigator.share) {
        navigator.share({ title: title, text: shareText, url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(`${shareText}\n${url}`);
        alert(`✅ 已複製商品推薦文案與購買連結！\n\n${shareText}\n${url}`);
      }
    }

    function openChangelog() { document.getElementById('changelog-modal').classList.remove('hidden'); }
    function closeChangelog() { document.getElementById('changelog-modal').classList.add('hidden'); }
  </script>
</body>
</html>
